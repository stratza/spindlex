services:
  openssh-server:
    build:
      context: .
      dockerfile: openssh.Dockerfile
    ports:
      - 22
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 5s
      timeout: 5s
      retries: 5

  dropbear-server:
    build:
      context: .
      dockerfile: dropbear.Dockerfile
    ports:
      - 22
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
