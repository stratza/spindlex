name: PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-quality:
    name: PR quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install project and tooling
        run: uv pip install --system -e ".[dev,docs,test]" pip-audit "setuptools<81" "semgrep>=1.136.0"

      - id: validate
        name: Validate PR metadata
        run: python scripts/validate_pr_body.py --event-path "$GITHUB_EVENT_PATH"

      - name: Lint and format
        run: |
          ruff check spindlex tests scripts
          ruff format --check spindlex tests scripts

      - name: Type check
        run: mypy spindlex

      - name: Unit tests
        run: pytest tests -m "not integration and not real_server and not slow and not performance"

      - name: Changelog check
        if: steps.validate.outputs.release_needed == 'true'
        run: python scripts/check_changelog_updated.py --event-path "$GITHUB_EVENT_PATH"

      - name: Docs build
        run: mkdocs build --strict

      - name: Security fast checks
        run: |
          bandit -r spindlex -c pyproject.toml
          semgrep scan --config p/python --config p/security-audit --metrics=off --severity ERROR --error spindlex
          python scripts/export_runtime_requirements.py --output runtime-requirements.txt
          pip-audit -r runtime-requirements.txt --cache-dir .pip-audit-cache
          uv run --with-requirements runtime-requirements.txt \
            python scripts/check_dependency_licenses.py \
            --exclude pip \
            --exclude setuptools \
            --exclude wheel \
            --fail-on-unknown

      - name: Secret scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml --no-git --redact --exit-code 1

      - name: Workflow lint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

      - name: Script compile
        run: python -m py_compile scripts/*.py

      - name: Summary
        run: echo "PR quality checks passed."

  compatibility-matrix:
    name: PR compatibility matrix
    needs: pr-quality
    uses: ./.github/workflows/ci-matrix.yml
    secrets: inherit

  integration:
    name: PR integration
    needs: compatibility-matrix
    uses: ./.github/workflows/integration.yml
    secrets: inherit

  property-tests:
    name: PR property tests
    needs: integration
    uses: ./.github/workflows/property.yml

  quality-gate:
    name: quality-gate
    needs:
      - pr-quality
      - compatibility-matrix
      - integration
      - property-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify sequential PR gates
        env:
          PR_QUALITY_RESULT: ${{ needs['pr-quality'].result }}
          COMPATIBILITY_RESULT: ${{ needs['compatibility-matrix'].result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PROPERTY_RESULT: ${{ needs['property-tests'].result }}
        run: |
          if [ "$PR_QUALITY_RESULT" != "success" ] ||
             [ "$COMPATIBILITY_RESULT" != "success" ] ||
             [ "$INTEGRATION_RESULT" != "success" ] ||
             [ "$PROPERTY_RESULT" != "success" ]; then
            echo "PR quality: $PR_QUALITY_RESULT"
            echo "Compatibility matrix: $COMPATIBILITY_RESULT"
            echo "Integration: $INTEGRATION_RESULT"
            echo "Property tests: $PROPERTY_RESULT"
            exit 1
          fi

          echo "All sequential PR gates passed."
