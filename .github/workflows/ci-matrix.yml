name: Compatibility Matrix

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      track_failures:
        description: "Track standalone matrix failures with deduplicated issues."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: compatibility-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-python:
    name: Ubuntu Python compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - run: |
          uv pip install --system -e ".[test]"
          pytest tests/ -m "not integration and not real_server and not slow and not performance" --timeout=120 --timeout-method=thread

      - name: Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: |
          uv pip install --system -e ".[test]"
          pytest tests/ -m "not integration and not real_server and not slow and not performance" --timeout=120 --timeout-method=thread

      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: |
          uv pip install --system -e ".[test]"
          pytest tests/ -m "not integration and not real_server and not slow and not performance" --timeout=120 --timeout-method=thread --cov=spindlex --cov-report=xml

      - name: Upload unit coverage
        if: github.event_name != 'workflow_call'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          uv pip install --system -e ".[test]"
          pytest tests/ -m "not integration and not real_server and not slow and not performance" --timeout=120 --timeout-method=thread

      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: |
          uv pip install --system -e ".[test]"
          pytest tests/ -m "not integration and not real_server and not slow and not performance" --timeout=120 --timeout-method=thread

      - name: Track repeated Ubuntu compatibility failures
        if: >
          failure() &&
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_call' || inputs.track_failures)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/track_workflow_failure.py ci \
            --repository "${{ github.repository }}" \
            --token "$GITHUB_TOKEN" \
            --workflow-name "${{ github.workflow }}" \
            --workflow-file "ci-matrix.yml" \
            --run-id "${{ github.run_id }}" \
            --run-url "$RUN_URL" \
            --branch "${{ github.ref_name }}" \
            --source-sha "${{ github.sha }}" \
            --event-name "${{ github.event_name }}" \
            --failed-stage "ubuntu-python"

  windows-smoke:
    name: Windows Python 3.11 smoke
    needs: ubuntu-python
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: |
          uv pip install --system -e ".[test]"
          pytest tests/ -m "not integration and not real_server and not slow and not performance" --timeout=120 --timeout-method=thread

      - name: Track repeated Windows compatibility failures
        if: >
          failure() &&
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_call' || inputs.track_failures)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/track_workflow_failure.py ci \
            --repository "${{ github.repository }}" \
            --token "$GITHUB_TOKEN" \
            --workflow-name "${{ github.workflow }}" \
            --workflow-file "ci-matrix.yml" \
            --run-id "${{ github.run_id }}" \
            --run-url "$RUN_URL" \
            --branch "${{ github.ref_name }}" \
            --source-sha "${{ github.sha }}" \
            --event-name "${{ github.event_name }}" \
            --failed-stage "windows-smoke"

  macos-smoke:
    name: macOS Python 3.11 smoke
    needs: windows-smoke
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: |
          uv pip install --system -e ".[test]"
          pytest tests/ -m "not integration and not real_server and not slow and not performance" --timeout=120 --timeout-method=thread

      - name: Track repeated macOS compatibility failures
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        if: >
          failure() &&
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_call' || inputs.track_failures)
        run: |
          python scripts/track_workflow_failure.py ci \
            --repository "${{ github.repository }}" \
            --token "$GITHUB_TOKEN" \
            --workflow-name "${{ github.workflow }}" \
            --workflow-file "ci-matrix.yml" \
            --run-id "${{ github.run_id }}" \
            --run-url "$RUN_URL" \
            --branch "${{ github.ref_name }}" \
            --source-sha "${{ github.sha }}" \
            --event-name "${{ github.event_name }}" \
            --failed-stage "macos-smoke"
