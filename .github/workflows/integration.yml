name: Integration

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      track_failures:
        description: "Track standalone integration failures with deduplicated issues."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-protocol:
    name: Docker OpenSSH and Dropbear
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - run: uv pip install --system -e ".[test]" pytest-docker pytest-timeout
      - name: Run Docker integration suite
        run: |
          pytest tests/integration/ tests/real_server/ tests/misc/test_functional_integration.py \
            -m "(integration or real_server) and not slow" \
            --tb=short \
            --timeout=120 \
            --timeout-method=thread \
            --cov=spindlex \
            --cov-report=xml
      - name: Upload integration coverage
        if: github.event_name != 'workflow_call'
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: ./coverage.xml
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Track repeated integration failures
        if: >
          failure() &&
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_call' || inputs.track_failures)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/track_workflow_failure.py ci \
            --repository "${{ github.repository }}" \
            --token "$GITHUB_TOKEN" \
            --workflow-name "${{ github.workflow }}" \
            --workflow-file "integration.yml" \
            --run-id "${{ github.run_id }}" \
            --run-url "$RUN_URL" \
            --branch "${{ github.ref_name }}" \
            --source-sha "${{ github.sha }}" \
            --event-name "${{ github.event_name }}" \
            --failed-stage "docker-protocol"
